<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One More Glow</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #05070c;
        color: #e6edf5;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #05070c;
      }

      .display { position: relative; }
      .profile-controls { position: absolute; inset: 0; pointer-events: none; }
      .profile-controls[hidden] { display: none; }
      .profile-controls input, .profile-controls button {
        position: absolute;
        pointer-events: auto;
        opacity: 0.001;
        cursor: pointer;
      }
      .profile-controls input { left: 15%; width: 70%; height: 30px; transform: translateY(-50%); }
      .profile-controls input:focus-visible, .profile-controls button:focus-visible { opacity: 0.35; }
      .profile-controls button { left: 10%; top: 71%; width: 28%; height: 8%; }

      #screen {
        display: block;
        background: #05070c;
      }

      .menu-toggle {
        z-index: 3;
        position: absolute;
        top: 12px;
        left: 12px;
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border: 1px solid #45606b;
        border-radius: 6px;
        background: rgb(5 7 12 / 88%);
        color: #b9f8ff;
        font-size: 20px;
        cursor: pointer;
      }

      .display-menu {
        z-index: 2;
        position: absolute;
        top: 62px;
        left: 12px;
        display: grid;
        gap: 16px;
        width: min(280px, calc(100% - 24px));
        padding: 18px;
        border: 1px solid #34505a;
        border-radius: 8px;
        background: rgb(5 10 16 / 96%);
        box-shadow: 0 10px 30px rgb(0 0 0 / 45%);
      }

      .display-menu[hidden], .animation-control[hidden] { display: none; }

      .display-menu h1 {
        margin: 0;
        color: #b9f8ff;
        font-size: 16px;
        font-weight: 650;
      }

      .control-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .control-label { grid-column: 1 / -1; margin-bottom: 2px; color: #9db1bc; font-size: 12px; }

      .display-menu button {
        min-height: 34px;
        border: 1px solid #314751;
        border-radius: 4px;
        background: #111b23;
        color: #dce8ed;
        cursor: pointer;
      }

      .display-menu button[aria-pressed="true"] {
        border-color: #54dff0;
        background: #12343b;
        color: #c4faff;
      }

      button:focus-visible, input:focus-visible { outline: 2px solid #ffbd72; outline-offset: 2px; }

      .animation-control { display: flex; align-items: center; gap: 9px; color: #dce8ed; font-size: 14px; }
      .animation-control input { accent-color: #54dff0; }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="display" aria-label="Rendering diagnostics">
      <canvas id="screen" width="800" height="600" aria-label="Rendering diagnostic display"></canvas>
      <div id="profile-controls" class="profile-controls" aria-label="Display profile" hidden>
        <input type="range" aria-label="Beam width in CSS pixels" data-profile="lineWidth" min="0.5" max="4" step="0.1" style="top: 25%" />
        <input type="range" aria-label="Point radius in CSS pixels" data-profile="pointRadius" min="0.5" max="4" step="0.1" style="top: 38%" />
        <input type="range" aria-label="Glow strength" data-profile="glowStrength" min="0" max="2" step="0.1" style="top: 51%" />
        <input type="range" aria-label="Glow spread" data-profile="glowSpread" min="0.5" max="2" step="0.1" style="top: 64%" />
        <button id="profile-reset" type="button" aria-label="Reset display profile">Reset</button>
      </div>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="display-menu">
        <span class="menu-icon" aria-hidden="true">☰</span>
        <span class="visually-hidden">Open display menu</span>
      </button>
      <section id="display-menu" class="display-menu" aria-label="Display settings" hidden>
        <h1>Display</h1>
        <div class="control-group" role="group" aria-label="Scene">
          <span class="control-label">Scene</span>
          <button type="button" data-scene="game" aria-pressed="false">Game</button>
          <button type="button" data-scene="testcard" aria-pressed="false">Test card</button>
          <button type="button" data-scene="segments" aria-pressed="false">Segments</button>
          <button type="button" data-scene="spacing" aria-pressed="false">Spacing</button>
          <button type="button" data-scene="profile" aria-pressed="false">Profile</button>
        </div>
        <div class="control-group" role="group" aria-label="Orientation">
          <span class="control-label">Orientation</span>
          <button type="button" data-orientation="landscape" aria-pressed="false">Landscape</button>
          <button type="button" data-orientation="portrait" aria-pressed="false">Portrait</button>
        </div>
        <label id="animation-control" class="animation-control" hidden>
          <input id="animation-toggle" type="checkbox" />
          <span>Animate craft</span>
        </label>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
