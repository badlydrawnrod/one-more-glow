<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070c" />
    <title>Asteroids — One More Glow</title>
  </head>
  <body>
    <main class="flight-app">
      <header class="topbar">
        <a class="wordmark" href="/" aria-label="One More Glow home">OMG<span> / </span>ASTEROIDS</a>
      </header>

      <section class="game-shell" aria-label="Asteroids arcade game">
        <canvas id="screen" width="1024" height="768" tabindex="-1" aria-label="Asteroids game and in-game display settings. On the title or pause screen, press S or use gamepad Back or Select to open settings. Press Enter to start, arrows or A and D to rotate, Up or W to thrust, Space to fire, Shift for hyperspace, and P to pause."></canvas>
        <div class="screen-vignette" aria-hidden="true"></div>
      </section>
      <footer class="controls" aria-label="Game controls">
        <div class="control-group"><span class="control-icon">↶ ↷</span><span><b>ROTATE</b><small>← → / A D / LEFT STICK / D-PAD</small></span></div>
        <div class="control-group"><span class="control-icon thrust-icon">↑</span><span><b>THRUST</b><small>↑ / W / STICK / D-PAD / A BUTTON</small></span></div>
        <div class="control-group"><span class="control-icon">✳</span><span><b>FIRE</b><small>SPACE / GAMEPAD B</small></span></div>
        <div class="control-group"><span class="control-icon thrust-icon">◎</span><span><b>HYPERSPACE</b><small>SHIFT / GAMEPAD X</small></span></div>
        <div class="control-note">P or gamepad Start pauses. Wrap the field. Stay alive.</div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
